name: Sync Forked Repos

on:
  schedule:
    - cron: '0 */1 * * *'  #runs every 1 hours
  workflow_dispatch: {}    # lets you trigger it manually from the Actions tab

jobs:
  sync-forks:
    runs-on: ubuntu-latest
    steps:
      - name: FOrce sync all forked repos with upstream
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT }}
        run: |
          set -euo pipefail

          USERNAME=$(gh api user --jq .login)
          echo "Syncing forks for $USERNAME"

          gh repo list "$USERNAME" --fork --limit 1000 --json name --jq '.[].name' \
          | while read -r repo; do
              FULL_NAME="$USERNAME/$REPO"
              echo "n Processing $FULL_NAME"

              #Get every branch that exist in this fork
              BRANCHES=$(gh api "repos/$FULL_NAME/branches" --paginate --jq '. [].name' 2>/dev/null || echo "")

              if [-z "$BRANCHES"]; then
                echo " Could not list branches, skiping"
                continue
              fi

              echo "$BRANCHES" | while read -r branch; do
                echo " 'n Syncing branch '$branch'"
                if gh repo sync "$FULL_NAME" --branch "$branch" --force; then
                  echo " Synced"
                else
                  echo "skiped (no matching upstream branch, or, sync failed)"
                fi
              done
            done
          echo "Done"
