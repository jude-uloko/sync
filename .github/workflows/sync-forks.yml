name: Sync Forked Repos

on:
  schedule:
    - cron: '0 */12 * * *'   # runs every 12 hours
  workflow_dispatch: {}      # lets you trigger it manually from the Actions tab

permissions:
  contents: write   # needed to commit the release-state file back
  issues: write      # needed to open notification issues

jobs:
  sync-forks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout host repo
        uses: actions/checkout@v4

      - name: Force-sync all branches of every fork (except skip list), notify on new releases
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT }}
        run: |
          set -euo pipefail

          # ── EDIT THIS LIST ──────────────────────────────────────────
          # Repo names (just the repo name, not owner/repo) to EXCLUDE
          # from force-sync. These still get release-check notifications,
          # but their branches are never touched or overwritten.
          SKIP_REPOS=()
          # ─────────────────────────────────────────────────────────────

          USERNAME=$(gh api user --jq .login)
          STATE_FILE="releases-state.json"

          if [ ! -f "$STATE_FILE" ]; then
            echo "{}" > "$STATE_FILE"
          fi

          is_skipped() {
            local repo="$1"
            for skip in "${SKIP_REPOS[@]}"; do
              if [ "$skip" == "$repo" ]; then
                return 0
              fi
            done
            return 1
          }

          echo "Syncing forks for $USERNAME"

          gh repo list "$USERNAME" --fork --limit 1000 --json name --jq '.[].name' \
          | while read -r repo; do
              FULL_NAME="$USERNAME/$repo"
              echo "→ Processing $FULL_NAME"

              if is_skipped "$repo"; then
                echo "  🛡️  in skip list — sync skipped, release check will still run"
              else
                BRANCHES=$(gh api "repos/$FULL_NAME/branches" --paginate --jq '.[].name' 2>/dev/null || echo "")

                if [ -z "$BRANCHES" ]; then
                  echo "  ⚠️ could not list branches, skipping sync for this repo"
                else
                  echo "$BRANCHES" | while read -r branch; do
                    echo "  → Syncing branch '$branch'"
                    if gh repo sync "$FULL_NAME" --branch "$branch" --force; then
                      echo "    ✅ synced"
                    else
                      echo "    ⚠️ skipped (no matching upstream branch, or sync failed)"
                    fi
                  done
                fi
              fi

              # Find the upstream (parent) repo
              PARENT=$(gh api "repos/$FULL_NAME" --jq '.parent.full_name // empty')
              if [ -z "$PARENT" ]; then
                echo "  ℹ️ no upstream found, skipping release check"
                continue
              fi

              # Get latest release from upstream (some repos have none)
              LATEST=$(gh api "repos/$PARENT/releases/latest" --jq '.tag_name' 2>/dev/null || echo "")
              if [ -z "$LATEST" ]; then
                echo "  ℹ️ $PARENT has no releases, skipping"
                continue
              fi

              PREV=$(jq -r --arg k "$PARENT" '.[$k] // empty' "$STATE_FILE")

              if [ "$LATEST" != "$PREV" ]; then
                echo "  🚀 New release detected for $PARENT: $LATEST (was: ${PREV:-none})"
                TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")

                BODY="**Upstream repo:** $PARENT **New version:** $LATEST **Detected:** $TIMESTAMP **Your fork:** $FULL_NAME"

                gh issue create \
                  --title "New release: $PARENT $LATEST" \
                  --body "$BODY"

                jq --arg k "$PARENT" --arg v "$LATEST" '.[$k] = $v' "$STATE_FILE" > tmp.json && mv tmp.json "$STATE_FILE"
              else
                echo "  ✓ no new release ($LATEST already known)"
              fi
            done

          echo "Done."

      - name: Commit updated release state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add releases-state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update release state [skip ci]"
            git push
          else
            echo "No state changes to commit"
          fi